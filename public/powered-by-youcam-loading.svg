<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 90 960 360" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&amp;display=swap');
      
      .text-main {
        font-family: 'Quicksand', 'Segoe UI', Roboto, Arial, sans-serif;
        text-anchor: start;
      }

      /* Colour pulse for "Powered by" (4 seconds) */
      .pulse-color {
        animation: pulseColor 4s ease-in-out infinite;
      }
      @keyframes pulseColor {
        0%, 100% { fill: #151A34; }
        50% { fill: #6673A3; }
      }

      /* Abrupt jumps between fewer, bolder colours (4 steps, 5 seconds each) */
      .api-strobe {
        animation: strobeColors 20s steps(4) infinite;
      }
      @keyframes strobeColors {
        0%   { fill: #00B0FF; } /* Original sky blue */
        25%  { fill: #FF0033; } /* Vibrant red */
        50%  { fill: #FFCC00; } /* Neon yellow */
        75%  { fill: #D400FF; } /* Electric purple */
        100% { fill: #00B0FF; } /* Back to the original blue */
      }
    </style>
  </defs>

  <!-- "Powered by" text with a colour pulse -->
  <text 
    x="108" 
    y="195" 
    class="text-main pulse-color"
    font-size="64" 
    font-weight="400" 
    fill="#151A34" 
    letter-spacing="0.5">
    Powered by
  </text>

  <!-- "YouCam API" text (fixed 150px size, no motion, no clipping) -->
  <text 
    x="108" 
    y="360" 
    class="text-main"
    font-size="150" 
    font-weight="600" 
    fill="#151A34" 
    letter-spacing="-0.5">
    YouCam<tspan class="api-strobe"> API</tspan>
  </text>
</svg>